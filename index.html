<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#152522">
    <meta name="description" content="Παίξε Πόρτες, Πλακωτό και Φεύγα με αντίπαλο τον υπολογιστή ή έναν δεύτερο παίκτη.">
    <title>Τάβλι</title>
  </head>
  <body>
    <main>
      <header>
        <h1>Τάβλι</h1>
        <form id="settings" aria-label="Νέα παρτίδα">
          <label>Παίκτες
            <select id="players">
              <option value="two">2 παίκτες</option>
              <option value="one">1 παίκτης</option>
              <option value="online">Online</option>
            </select>
          </label>
          <label>Παιχνίδι
            <select id="mode">
              <option value="portes">Πόρτες</option>
              <option value="plakoto">Πλακωτό</option>
              <option value="fevga">Φεύγα</option>
              <option value="match">Αγώνας με εναλλαγή</option>
            </select>
          </label>
          <label id="target-label" hidden>Πόντοι
            <select id="target"><option>3</option><option selected>5</option><option>7</option></select>
          </label>
          <button id="start-game" class="secondary" type="submit">Νέο παιχνίδι</button>
        </form>
      </header>
      <section id="online" class="online" aria-label="Online δωμάτιο" hidden>
        <form id="join-room">
          <label for="room-code">Κωδικός δωματίου</label>
          <input id="room-code" type="text" maxlength="6" size="8" autocapitalize="characters" autocomplete="off" spellcheck="false" required>
          <button class="secondary" type="submit">Σύνδεση</button>
        </form>
        <div id="room-info" class="room-info" hidden>
          <p>Δωμάτιο <strong id="room-id"></strong> · <span id="room-seat"></span></p>
          <button id="invite" class="secondary" type="button">Αντιγραφή πρόσκλησης</button>
          <input id="invite-url" type="text" readonly aria-label="Σύνδεσμος πρόσκλησης" hidden>
          <button id="leave-room" class="secondary" type="button">Έξοδος</button>
        </div>
        <p id="room-status" role="status"></p>
      </section>
      <section class="table" aria-label="Τραπέζι παιχνιδιού">
        <div class="score">
          <span><i class="token ivory"></i> Λευκά <strong id="ivory-score">0</strong></span>
          <h2 id="variant">Πόρτες</h2>
          <span><strong id="red-score">0</strong> <span id="red-name">Κόκκινα</span> <i class="token red"></i></span>
        </div>
        <div id="board" class="board" role="group" aria-label="Ταμπλό με 24 θέσεις"></div>
        <div class="turn">
          <div>
            <p id="status" role="status"></p>
            <div id="dice" class="dice" aria-label="Ζάρια"></div>
          </div>
          <div class="actions">
            <button id="bar" class="secondary" type="button" aria-pressed="false">Μπάρα</button>
            <div id="off" class="off" aria-label="Μάζεμα"></div>
            <button id="roll" class="primary" type="button">Ρίξε ζάρια</button>
          </div>
        </div>
      </section>
      <p class="help">Επίλεξε πούλι και μετά μία από τις φωτισμένες θέσεις.</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
